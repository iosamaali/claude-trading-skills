name: stock-alert-monitor

# Persistent catalyst monitor that runs OFF any Claude session, on GitHub's
# runners (which have open network egress), and pushes new matches to a Telegram
# bot via the Telegram Bot API.
#
# Setup (one time):
#   1. Create a bot with @BotFather and copy its token.
#   2. Get your chat id: message the bot, then open
#      https://api.telegram.org/bot<token>/getUpdates and read result[].message.chat.id
#   3. Settings -> Secrets and variables -> Actions -> New repository secret
#        Name: ALERT_TELEGRAM_TOKEN    Value: <bot token>
#        Name: ALERT_TELEGRAM_CHAT_ID  Value: <chat id>
#
# Trigger it by schedule (below) or manually via "Run workflow".

on:
  schedule:
    # weekdays: every 10 min, all hours — covers pre-market, regular session,
    # and after-hours (catalysts frequently drop pre-open and after the close).
    - cron: "*/10 * * * 1-5"
    # weekends: hourly — catch weekend M&A / deal announcements.
    - cron: "0 * * * 0,6"
    # NOTE: GitHub runs schedules in UTC and may delay them under load.
  workflow_dispatch:
    inputs:
      strict:
        description: "Drop matches whose float/RVOL/%change can't be confirmed"
        type: boolean
        default: false
      loose:
        description: "TEST: loosen the screen (more alerts) to confirm delivery"
        type: boolean
        default: false
      test_ping:
        description: "TEST: send one Telegram test message and exit (verify delivery)"
        type: boolean
        default: false
      equity:
        description: "Account equity for position sizing (USD)"
        type: string
        default: "25000"

permissions:
  contents: read

# run the JS actions on Node 24 (Node 20 is deprecated on the runners)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: stock-alert-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # de-dup memory carried across runs (read newest, write a fresh entry)
      - name: Restore seen-state
        uses: actions/cache@v4
        with:
          path: .cache/seen.txt
          key: stock-alert-seen-${{ github.run_id }}
          restore-keys: |
            stock-alert-seen-

      # cache the SEC issuer map so it isn't re-fetched every run (TTL handled in-script)
      - name: Restore SEC issuer map
        uses: actions/cache@v4
        with:
          path: .cache/company_tickers.json
          key: sec-issuers-${{ github.run_id }}
          restore-keys: |
            sec-issuers-

      - name: Scan + alert
        env:
          ALERT_TELEGRAM_TOKEN: ${{ secrets.ALERT_TELEGRAM_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          # Telegram @username to mention on 🔥 hot (3x-runner) alerts so they push
          # on-spot. Override by setting an ALERT_MENTION repo variable.
          ALERT_MENTION: ${{ vars.ALERT_MENTION || '' }}
          STRICT_FLAG: ${{ (inputs.strict && '--strict') || '--no-strict' }}
          EQUITY: ${{ inputs.equity || '25000' }}
          LOOSE: ${{ inputs.loose && 'true' || 'false' }}
          TEST_PING: ${{ inputs.test_ping && 'true' || 'false' }}
        run: |
          if [ -z "$ALERT_TELEGRAM_TOKEN" ] || [ -z "$ALERT_TELEGRAM_CHAT_ID" ]; then
            echo "::error::ALERT_TELEGRAM_TOKEN / ALERT_TELEGRAM_CHAT_ID secrets are not set — add them under Settings > Secrets > Actions"
            exit 1
          fi
          # TEST mode (manual only): just confirm Telegram delivery, then exit.
          if [ "$TEST_PING" = "true" ]; then
            python skills/stock-alert-monitor/monitor.py --test-ping \
              --telegram-token "$ALERT_TELEGRAM_TOKEN" \
              --telegram-chat-id "$ALERT_TELEGRAM_CHAT_ID" \
              --mention "$ALERT_MENTION"
            exit $?
          fi
          mkdir -p .cache
          # Default (cron): strict micro-cap momentum screen, shared seen-state.
          SCREEN=""
          STATE=".cache/seen.txt"
          if [ "$LOOSE" = "true" ]; then
            # TEST mode (manual only): drop the momentum gates to keyword+ticker
            # only (0 disables each gate) across any exchange and the full sub-$20
            # universe, so a real qualifying press release pushes on the next pass.
            # Cap the burst and use a separate seen-state so it doesn't disturb the
            # strict cron's dedup.
            SCREEN="--any-exchange --min-change-pct 0 --min-rel-vol 0 --min-avg-vol 0 --max-float 0 --max-price 20 --max-alerts 3"
            STATE=".cache/seen-loose.txt"
          fi
          # --no-strict by default so keyword+price matches still alert even when
          # the runner can't fetch float/RVOL/%change; flip via "Run workflow".
          python skills/stock-alert-monitor/monitor.py \
            --once $STRICT_FLAG $SCREEN \
            --equity "$EQUITY" \
            --state "$STATE" \
            --issuer-cache .cache/company_tickers.json \
            --mention "$ALERT_MENTION" \
            --telegram-token "$ALERT_TELEGRAM_TOKEN" \
            --telegram-chat-id "$ALERT_TELEGRAM_CHAT_ID"
